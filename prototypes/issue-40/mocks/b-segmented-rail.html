<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B — segmented rail</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #e9e8e2; color: #17202a; font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 6px; font: 500 26px Georgia, serif; }
  .intro { margin: 0 0 28px; color: #58616a; }
  .gallery { display: flex; align-items: start; gap: 28px; flex-wrap: wrap; }
  .sample { margin: 0; }
  figcaption { margin-bottom: 10px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .desktop { width: min(850px, calc(100vw - 64px)); }
  .phone { width: 390px; max-width: calc(100vw - 64px); }
  .screen { position: relative; isolation: isolate; overflow: hidden; min-height: 580px; border: 1px solid #34465a; border-radius: 10px; background: #101c2b; color: #f7f5ef; box-shadow: 0 16px 38px #17202a27; }
  .screen::before { position: absolute; z-index: -1; inset: 0; content: ""; background: radial-gradient(circle at 80% 30%, #3c617870, transparent 34%), radial-gradient(circle at 25% 75%, #57426466, transparent 40%), linear-gradient(135deg, #0c1724, #18283b); }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 35px; border-bottom: 1px solid #ffffff20; font-size: 13px; }
  .brand { font-family: Georgia, serif; font-size: 19px; }
  .nav { color: #bac5cd; }
  .hero { padding: 72px 8% 120px; }
  .eyebrow { color: #adbcc8; font-size: 10px; letter-spacing: .12em; }
  .hero h2 { margin: 18px 0; font: 400 clamp(38px, 5vw, 59px)/1.06 Georgia, serif; }
  .hero p { max-width: 400px; color: #c4d0d6; }
  .actions { display: flex; gap: 9px; margin-top: 25px; }
  .actions span { padding: 8px 17px; border: 1px solid #ddd; border-radius: 30px; font-size: 12px; }
  .rail { position: absolute; right: 0; bottom: 0; left: 0; padding: 12px 24px 15px; border-top: 1px solid #ffffff38; background: #111e2cdd; backdrop-filter: blur(12px); }
  .rail strong { display: block; margin-bottom: 8px; color: #c4d0d6; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .09em; }
  .segments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 4px; border: 1px solid #71889b8c; border-radius: 12px; background: #0e1926; }
  .segments span { display: grid; align-items: center; min-height: 34px; padding: 5px 8px; border-radius: 8px; color: #bacbd6; font-size: 11px; line-height: 1.15; text-align: center; }
  .segments small { font-size: 9px; }
  .segments .active { background: #dce8ee; color: #102334; font-weight: 700; }
  .phone .screen { min-height: 800px; }
  .phone .top { padding: 18px 20px; }
  .phone .nav { font-size: 19px; }
  .phone .hero { padding: 125px 25px 230px; }
  .phone .hero h2 { font-size: 39px; }
  .phone .actions { flex-wrap: wrap; }
  .phone .rail { padding: 13px 12px 16px; }
  .phone .segments { grid-template-columns: repeat(2, 1fr); }
  .phone .segments span { min-height: 35px; font-size: 10px; }
</style>
<h1>B · Segmented rail</h1>
<p class="intro">All six click and press effects, plus Off, stay visible in a full-width rail over the same particle field.</p>
<div class="gallery">
  <figure class="sample desktop"><figcaption>Desktop · persistent rail</figcaption><div class="screen">
    <div class="top"><span class="brand">Andrew McDonald</span><span class="nav">Essays &nbsp; Projects &nbsp; About</span></div>
    <div class="hero"><div class="eyebrow">ANDREW MCDONALD · BACKEND &amp; SYSTEMS ENGINEER · MELBOURNE</div><h2>From philosophy<br>to software</h2><p>A personal collection of essays, projects, and notes.</p><div class="actions"><span>Read essays</span><span>Browse projects</span></div></div>
    <div class="rail"><strong>Click interaction</strong><div class="segments"><span class="active">Off</span><span>Shockwave</span><span>Gravity well<br><small>Implosion / slow pull</small></span><span>Vortex</span><span>Particle scatter</span><span>Press → gather → release</span><span>Local turbulence</span></div></div>
  </div></figure>
  <figure class="sample phone"><figcaption>Phone · 390px · compact rail</figcaption><div class="screen">
    <div class="top"><span class="brand">Andrew McDonald</span><span class="nav">☰</span></div>
    <div class="hero"><div class="eyebrow">BACKEND &amp; SYSTEMS ENGINEER</div><h2>From philosophy<br>to software</h2><p>A personal collection of essays, projects, and notes.</p><div class="actions"><span>Read essays</span><span>Browse projects</span></div></div>
    <div class="rail"><strong>Click interaction</strong><div class="segments"><span class="active">Off</span><span>Shockwave</span><span>Gravity well<br><small>Implosion / slow pull</small></span><span>Vortex</span><span>Particle scatter</span><span>Press → gather → release</span><span>Local turbulence</span></div></div>
  </div></figure>
</div>
</html>
