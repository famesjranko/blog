<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — compact disclosure</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #e9e8e2; color: #17202a; font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 6px; font: 500 26px Georgia, serif; }
  .intro { margin: 0 0 28px; color: #58616a; }
  .gallery { display: flex; align-items: start; gap: 28px; flex-wrap: wrap; }
  .sample { margin: 0; }
  figcaption { margin-bottom: 10px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .desktop { width: min(850px, calc(100vw - 64px)); }
  .phone { width: 390px; max-width: calc(100vw - 64px); }
  .screen { position: relative; isolation: isolate; overflow: hidden; min-height: 520px; border: 1px solid #34465a; border-radius: 10px; background: #101c2b; color: #f7f5ef; box-shadow: 0 16px 38px #17202a27; }
  .screen::before { position: absolute; z-index: -1; inset: 0; content: ""; background: radial-gradient(circle at 80% 30%, #3c617870, transparent 34%), radial-gradient(circle at 25% 75%, #57426466, transparent 40%), linear-gradient(135deg, #0c1724, #18283b); }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 35px; border-bottom: 1px solid #ffffff20; font-size: 13px; }
  .brand { font-family: Georgia, serif; font-size: 19px; }
  .nav { color: #bac5cd; }
  .hero { padding: 94px 8% 30px; }
  .eyebrow { color: #adbcc8; font-size: 10px; letter-spacing: .12em; }
  .hero h2 { margin: 18px 0; font: 400 clamp(38px, 5vw, 59px)/1.06 Georgia, serif; }
  .hero p { max-width: 400px; color: #c4d0d6; }
  .actions { display: flex; gap: 9px; margin-top: 25px; }
  .actions span { padding: 8px 17px; border: 1px solid #ddd; border-radius: 30px; font-size: 12px; }
  .selector { position: absolute; right: 24px; bottom: 22px; width: 205px; border: 1px solid #98acbb68; border-radius: 10px; background: #101e2be8; box-shadow: 0 10px 30px #0005; }
  .selector summary { padding: 11px 14px; cursor: default; font-size: 12px; font-weight: 700; list-style: none; }
  .selector summary::after { float: right; content: "⌄"; }
  .selector .body { padding: 0 14px 14px; }
  .selector label { display: block; margin-bottom: 6px; color: #bccbd4; font-size: 11px; }
  .selector select { width: 100%; padding: 8px; border: 1px solid #8193a3; border-radius: 5px; background: #192c3e; color: white; font: inherit; }
  .hint { margin: 8px 0 0; color: #a9b8c3; font-size: 10px; }
  .phone .screen { min-height: 690px; }
  .phone .top { padding: 18px 20px; }
  .phone .nav { font-size: 19px; }
  .phone .hero { padding: 138px 25px 0; }
  .phone .hero h2 { font-size: 39px; }
  .phone .actions { flex-wrap: wrap; }
  .phone .selector { right: 14px; bottom: 14px; left: 14px; width: auto; }
</style>
<h1>A · Compact disclosure</h1>
<p class="intro">A quiet control at the lower edge. The native select compares six click and press effects in the existing particle field, plus Off.</p>
<div class="gallery">
  <figure class="sample desktop"><figcaption>Desktop · disclosure open</figcaption><div class="screen">
    <div class="top"><span class="brand">Andrew McDonald</span><span class="nav">Essays &nbsp; Projects &nbsp; About</span></div>
    <div class="hero"><div class="eyebrow">ANDREW MCDONALD · BACKEND &amp; SYSTEMS ENGINEER · MELBOURNE</div><h2>From philosophy<br>to software</h2><p>A personal collection of essays, projects, and notes.</p><div class="actions"><span>Read essays</span><span>Browse projects</span></div></div>
    <details class="selector" open><summary>Preview click interaction</summary><div class="body"><label for="desktop-scene">Click or press effect</label><select id="desktop-scene"><option selected>Off</option><option>Shockwave</option><option>Gravity well (short implosion / slow pull)</option><option>Vortex</option><option>Particle scatter</option><option>Press → gather → release</option><option>Local turbulence</option></select><p class="hint">Click or tap the field to try it. This choice is temporary.</p></div></details>
  </div></figure>
  <figure class="sample phone"><figcaption>Phone · 390px · disclosure open</figcaption><div class="screen">
    <div class="top"><span class="brand">Andrew McDonald</span><span class="nav">☰</span></div>
    <div class="hero"><div class="eyebrow">BACKEND &amp; SYSTEMS ENGINEER</div><h2>From philosophy<br>to software</h2><p>A personal collection of essays, projects, and notes.</p><div class="actions"><span>Read essays</span><span>Browse projects</span></div></div>
    <details class="selector" open><summary>Preview click interaction</summary><div class="body"><label for="phone-scene">Click or press effect</label><select id="phone-scene"><option selected>Off</option><option>Shockwave</option><option>Gravity well (short implosion / slow pull)</option><option>Vortex</option><option>Particle scatter</option><option>Press → gather → release</option><option>Local turbulence</option></select><p class="hint">Click or tap the field to try it. This choice is temporary.</p></div></details>
  </div></figure>
</div>
</html>
