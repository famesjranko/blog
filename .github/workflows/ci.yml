name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned so the runner OS changes only by an explicit edit, not by the
    # ubuntu-latest migration (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check
        id: check
        run: make check
      - name: Upload Playwright failure images
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-images
          path: test-results/
          if-no-files-found: warn
  browser-windows:
    # Deliberately a browser-only subset: the full gate runs once on Ubuntu
    # through make check, and the Windows runner image has no GNU make.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:browser
  capture-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/resolve-preview.test.mjs
      - name: Wait for this commit's Cloudflare preview
        id: preview
        run: node scripts/resolve-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
      - name: Capture preview screenshots and geometry
        run: npx playwright test tests/browser/visual.spec.ts tests/browser/geometry.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          PLAYWRIGHT_RESULTS_DIR: ${{ runner.temp }}/blog-preview-capture
      - name: Upload preview capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-capture-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/blog-preview-capture/
          if-no-files-found: warn
