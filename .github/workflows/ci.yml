name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned so the runner OS changes only by an explicit edit, not by the
    # ubuntu-latest migration (actions/runner-images#14748).
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 -y --no-progress
      - if: runner.os == 'Windows'
        run: |
          where.exe make
          make --version
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: make check
