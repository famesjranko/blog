name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned so the runner OS changes only by an explicit edit, not by the
    # ubuntu-latest migration (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate Playwright results
        run: echo "PLAYWRIGHT_RESULTS_DIR=$(node -p 'require("node:os").tmpdir()')/blog-playwright-results" >> "$GITHUB_ENV"
      - name: Check
        id: check
        run: make check
      - name: Upload Playwright failure images
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-images
          path: ${{ env.PLAYWRIGHT_RESULTS_DIR }}/
          if-no-files-found: ignore
  browser-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:browser
