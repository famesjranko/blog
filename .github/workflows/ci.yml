name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned so the runner OS changes only by an explicit edit, not by the
    # ubuntu-latest migration (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
