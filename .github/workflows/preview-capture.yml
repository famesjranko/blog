name: preview capture
on:
  pull_request:
concurrency:
  group: preview-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
      summary: ${{ steps.summary.outputs.summary }}
      capture-status: ${{ steps.summary.outcome == 'failure' && 'failed' || steps.capture.outcome == 'success' && 'passed' || steps.preview.outputs.preview == 'none' && 'skipped' || 'failed' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this commit's Cloudflare preview
        id: preview
        continue-on-error: true
        timeout-minutes: 22
        run: npx tsx scripts/resolve-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
      - name: Capture preview screenshots and geometry
        id: capture
        if: steps.preview.outcome == 'success' && steps.preview.outputs.preview != 'none'
        continue-on-error: true
        timeout-minutes: 10
        run: npx playwright test -c playwright.preview.config.ts tests/browser/visual.spec.ts tests/browser/geometry.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
      - name: Summarize capture measurements
        id: summary
        if: steps.capture.outcome == 'success' || steps.capture.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -f "$PLAYWRIGHT_RESULTS_FILE" ]; then
            npx tsx scripts/preview-comment.ts --summary >> "$GITHUB_OUTPUT"
          elif [ "$CAPTURE_OUTCOME" = 'success' ]; then
            echo '::error::Playwright capture passed without a results report.'
            exit 1
          else
            echo '::notice::Playwright capture failed before writing a results report.'
          fi
        env:
          PLAYWRIGHT_RESULTS_FILE: test-results/preview/results.json
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
      - name: Upload preview capture
        if: always()
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-capture-${{ github.event.pull_request.head.sha }}
          path: test-results/preview/
          if-no-files-found: warn
      - name: Report a failed preview capture
        if: steps.preview.outcome == 'failure' || steps.capture.outcome == 'failure' || steps.summary.outcome == 'failure'
        run: >-
          echo "::warning::Preview capture is diagnostic and did not gate this PR.
          Resolve step: $RESOLVE_OUTCOME; capture step: $CAPTURE_OUTCOME;
          summary step: $SUMMARY_OUTCOME.
          The preview-capture artifact holds any evidence."
        env:
          RESOLVE_OUTCOME: ${{ steps.preview.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
  comment-preview:
    needs: capture-preview
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Comment on pull request
        run: npx tsx scripts/preview-comment.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.capture-preview.outputs.preview-url }}
          ARTIFACT_URL: ${{ needs.capture-preview.outputs.artifact-url }}
          PLAYWRIGHT_SUMMARY: ${{ needs.capture-preview.outputs.summary }}
          PREVIEW_CAPTURE_STATUS: ${{ needs.capture-preview.result == 'success' && needs.capture-preview.outputs.capture-status || 'failed' }}
