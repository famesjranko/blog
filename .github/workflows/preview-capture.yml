name: preview capture
on:
  pull_request:
concurrency:
  group: preview-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/resolve-preview.test.mjs scripts/preview-comment.test.mjs
      - name: Wait for this commit's Cloudflare preview
        id: preview
        run: node scripts/resolve-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
      - name: Capture preview screenshots and geometry
        run: npx playwright test tests/browser/visual.spec.ts tests/browser/geometry.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          PLAYWRIGHT_RESULTS_DIR: ${{ runner.temp }}/blog-preview-capture
      - name: Summarize capture measurements
        id: summary
        run: node scripts/preview-comment.mjs --summary >> "$GITHUB_OUTPUT"
        env:
          PLAYWRIGHT_RESULTS_FILE: ${{ runner.temp }}/blog-preview-capture/results.json
      - name: Upload preview capture
        if: always()
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-capture-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/blog-preview-capture/
          if-no-files-found: error
  comment-preview:
    needs: capture-preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Comment on pull request
        run: node scripts/preview-comment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.capture-preview.outputs.preview-url }}
          ARTIFACT_URL: ${{ needs.capture-preview.outputs.artifact-url }}
          PLAYWRIGHT_SUMMARY: ${{ needs.capture-preview.outputs.summary }}
