name: preview capture
on:
  pull_request:
permissions:
  contents: read
  checks: read
  issues: write
concurrency:
  group: preview-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/resolve-preview.test.mjs scripts/preview-comment.test.mjs
      - name: Wait for this commit's Cloudflare preview
        id: preview
        run: node scripts/resolve-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
      - name: Capture preview screenshots and geometry
        run: npx playwright test tests/browser/visual.spec.ts tests/browser/geometry.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          PLAYWRIGHT_RESULTS_DIR: ${{ runner.temp }}/blog-preview-capture
      - name: Upload preview capture
        if: always()
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-capture-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/blog-preview-capture/
          if-no-files-found: error
      - name: Comment on pull request
        if: success()
        run: node scripts/preview-comment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PLAYWRIGHT_RESULTS_FILE: ${{ runner.temp }}/blog-preview-capture/results.json
