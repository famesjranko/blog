name: Deploy blog to shared GitHub Pages
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm deployment
        required: true
        default: ""
permissions:
  contents: read
concurrency:
  group: shared-github-pages-blog
  cancel-in-progress: false
jobs:
  deploy:
    # Pinned so the runner OS changes only by an explicit edit, not by the
    # ubuntu-latest migration (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout blog
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
      - run: npm run build
        env:
          BASE_PATH: /blog
          SITE_ORIGIN: https://famesjranko.github.io
      - name: Checkout shared Pages repository
        uses: actions/checkout@v7
        with:
          repository: famesjranko/famesjranko.github.io
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages
      - name: Synchronize the blog
        run: |
          mkdir -p pages/blog
          rsync -a --delete dist/ pages/blog/
      - name: Commit and push blog changes
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all blog/
          git diff --cached --quiet || git commit -m "Deploy blog"
          git pull --rebase
          git push
