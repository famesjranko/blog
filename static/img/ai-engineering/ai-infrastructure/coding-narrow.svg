<text x="100" y="46" class="muted">any device</text>
<path class="flow" d="M48 56V118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coding-phone-arrow)" />
<text x="62" y="92" class="muted">open T3 · Tailscale</text>
