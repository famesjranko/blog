<marker id="coding-phone-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
<path class="arrowhead" d="M1 1L9 5L1 9Z" />
</marker>
</defs>
<g class="device device-external" transform="translate(16 0) scale(0.8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="14" y="4" width="52" height="38" rx="4" />
<rect class="screen" x="20" y="10" width="40" height="26" rx="2" />
