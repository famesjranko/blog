<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 844" role="img" aria-labelledby="coding-phone-title coding-phone-desc" class="diagram diagram-infra infra-narrow">
<title id="coding-phone-title">Coding layer — phone</title>
<desc id="coding-phone-desc">A browser opens T3 Code over Tailscale on the Workbench VM. T3 controls native Codex and Claude Code sessions. The harnesses edit and run local repositories and tools, and separately send model requests to external providers, directly or through llmtrim, an optional proxy on the workbench. Each harness uses its own provider login.</desc>
