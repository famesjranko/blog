<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 664" role="img" aria-labelledby="homelab-phone-title homelab-phone-desc" class="diagram diagram-infra infra-narrow">
<title id="homelab-phone-title">Homelab — phone</title>
<desc id="homelab-phone-desc">A browser opens T3 over Tailscale on the permanent Workbench VM inside the physical Proxmox host. The workbench reaches guest VMs over SSH on the lab network. Resources available when needed: guest VMs; the host GPU, which can pass through to one VM; and TrueNAS, a separate physical machine both VMs reach over the LAN with optional NFS.</desc>
