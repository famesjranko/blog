<rect x="6" y="4" width="68" height="56" rx="4" />
<path d="M6 18h68M14 11h.1M20 11h.1M26 11h.1M28 18v42M38 30h28M38 40h20M38 50h24" />
</g>
<text x="124" y="218" class="heading">T3 Code</text>
<text x="124" y="242" class="muted">UI · session server</text>
