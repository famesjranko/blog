<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 520" role="img" aria-labelledby="coding-desktop-title coding-desktop-desc" class="diagram diagram-infra infra-wide">
<title id="coding-desktop-title">Coding layer — desktop</title>
<desc id="coding-desktop-desc">A browser opens T3 Code over Tailscale on the Workbench VM. T3 controls native Codex and Claude Code sessions. The harnesses edit and run local repositories and tools, and separately send model requests to external providers, directly or through llmtrim, an optional proxy on the workbench. Each harness uses its own provider login.</desc>
<defs>
<marker id="coding-desktop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
<path class="arrowhead" d="M1 1L9 5L1 9Z" />
</marker>
</defs>
<g class="device device-external" transform="translate(24 0) scale(1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="14" y="4" width="52" height="38" rx="4" />
<rect class="screen" x="20" y="10" width="40" height="26" rx="2" />
