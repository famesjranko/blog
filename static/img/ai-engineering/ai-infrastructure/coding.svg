<text x="124" y="52" class="muted">any device</text>
<path class="flow" d="M64 70V130" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coding-desktop-arrow)" />
<text x="80" y="104" class="muted">open T3 · Tailscale</text>
