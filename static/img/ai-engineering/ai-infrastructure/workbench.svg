<text x="582" y="354" class="muted" text-anchor="middle">separate physical machine</text>
<text x="582" y="378" class="muted" text-anchor="middle">LAN from both VMs</text>
<text x="582" y="402" class="muted" text-anchor="middle">NFS optional</text>
