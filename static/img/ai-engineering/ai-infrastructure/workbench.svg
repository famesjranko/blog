<svg class="diagram diagram-lead-team diagram-infrastructure" viewBox="0 0 560 480" role="img" aria-labelledby="workbench-title workbench-desc" xmlns="http://www.w3.org/2000/svg">
<title id="workbench-title">Where the work happens</title>
<desc id="workbench-desc">A browser reaches the permanent AI workbench VM through Tailscale. Proxmox hosts the workbench and a separate disposable lab guest. The workbench runs T3 Code and coding runtimes with Git worktrees, rootless Docker and a local request proxy. External services include GitHub, hosted models and cloud tools. The lab guest can use NFS storage from TrueNAS on a separate physical machine. Lab-control represents guest access and management; the gateway controls provisioning through Proxmox.</desc>
