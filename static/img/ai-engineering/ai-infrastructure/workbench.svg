<text x="582" y="140" class="heading" text-anchor="middle">Host GPU</text>
<text x="582" y="164" class="muted" text-anchor="middle">Proxmox hardware</text>
<text x="582" y="188" class="muted" text-anchor="middle">passthrough to one VM</text>
