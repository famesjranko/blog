<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-lead-team" viewBox="0 0 760 995" role="img" aria-labelledby="dependencies-title dependencies-desc">
<title id="dependencies-title">Dependencies with a new fix and re-check</title>
<desc id="dependencies-desc">Two worker agents own independent tasks that follow the plan. Accepted branches are integrated before a reviewer agent examines them. A confirmed finding leads to a new fix and re-check. The queued final verification is revised to wait for the re-check. Arrows represent acceptance dependencies, not elapsed time.</desc>
<defs><marker id="dependencies-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs>
<rect x="250" y="20" width="260" height="80" rx="12" class="frame"/>
<text x="380.0" y="52" text-anchor="middle" class="heading">Plan</text>
<text x="380.0" y="80" text-anchor="middle" class="label">Accepted task boundaries</text>
<path d="M 380 100 V 130 H 180" class="flow"/>
<path d="M 380 130 H 580" class="flow"/>
<path d="M 180 130 V 170" class="flow" marker-end="url(#dependencies-arrow)"/>
<path d="M 580 130 V 170" class="flow" marker-end="url(#dependencies-arrow)"/>
<rect x="25" y="170" width="310" height="110" rx="12" class="frame"/>
<text x="180.0" y="202" text-anchor="middle" class="heading">Calculation worker</text>
<text x="180.0" y="230" text-anchor="middle" class="label">readingTime.ts + tests</text>
<text x="180.0" y="255" text-anchor="middle" class="label">Own worktree</text>
<rect x="425" y="170" width="310" height="110" rx="12" class="frame"/>
<text x="580.0" y="202" text-anchor="middle" class="heading">Badge worker</text>
<text x="580.0" y="230" text-anchor="middle" class="label">Separate owned files</text>
<text x="580.0" y="255" text-anchor="middle" class="label">Own worktree</text>
<path d="M 180 280 V 330 H 380" class="flow"/>
<path d="M 580 280 V 330 H 380" class="flow"/>
<path d="M 380 330 V 342" class="flow"/>
<path d="M 380 383 V 405" class="flow" marker-end="url(#dependencies-arrow)"/>
<text x="380" y="370" text-anchor="middle" class="muted">Lead integrates accepted branches</text>
<rect x="230" y="405" width="300" height="90" rx="12" class="structural-frame"/>
<text x="380.0" y="437" text-anchor="middle" class="heading">Review</text>
<text x="380.0" y="465" text-anchor="middle" class="label">Examines integrated result</text>
<rect x="15" y="565" width="730" height="175" rx="16" class="group-frame rework-group"/>
<text x="380" y="598" text-anchor="middle" class="muted">New tasks for a confirmed finding</text>
<path d="M 380 495 V 535 H 180 V 625" class="flow" marker-end="url(#dependencies-arrow)"/>
<rect x="35" y="625" width="290" height="90" rx="12" class="frame"/>
<text x="180.0" y="657" text-anchor="middle" class="heading">Fix</text>
<text x="180.0" y="685" text-anchor="middle" class="label">Worker + regression test</text>
<path d="M 325 670 H 435" class="flow" marker-end="url(#dependencies-arrow)"/>
<rect x="435" y="625" width="290" height="90" rx="12" class="structural-frame"/>
<text x="580.0" y="657" text-anchor="middle" class="heading">Re-check</text>
<text x="580.0" y="685" text-anchor="middle" class="label">Fresh task; same lens</text>
<path d="M 580 715 V 790 H 380 V 825" class="flow" marker-end="url(#dependencies-arrow)"/>
<rect x="230" y="825" width="300" height="95" rx="12" class="frame"/>
<text x="380.0" y="857" text-anchor="middle" class="heading">Final verification</text>
<text x="380.0" y="885" text-anchor="middle" class="label">Queued until re-check accepted</text>
<text x="380" y="969" text-anchor="middle" class="muted">Each dependency requires acceptance, not just a returned report.</text>
</svg>
