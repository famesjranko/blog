<svg xmlns="http://www.w3.org/2000/svg" viewBox="116 36 376 376" role="img" aria-labelledby="title desc">
  <title id="title">P entails Q: equivalence under conjunction</title>
  <desc id="desc">A smaller orange region labelled P equals P and Q sits entirely inside a larger cyan region labelled Q.</desc>

  <style>
    .set-q {
      fill: none;
      stroke: #54d4e8;
      stroke-width: 4;
    }

    .set-p {
      fill: none;
      stroke: #ffad66;
      stroke-width: 4;
    }

  </style>

  <circle class="set-q" cx="304" cy="224" r="164"/>
  <circle class="set-p" cx="344" cy="252" r="108"/>

  <text x="205" y="145" style="fill:#dce5ea;font-family:ui-serif,Georgia,Cambria,'Times New Roman',serif;font-size:34px;font-style:italic;font-weight:600">Q</text>
  <text x="344" y="252" style="fill:#dce5ea;font-family:ui-serif,Georgia,Cambria,'Times New Roman',serif;font-size:28px;font-weight:600;text-anchor:middle;dominant-baseline:middle">P = P ∧ Q</text>
</svg>
