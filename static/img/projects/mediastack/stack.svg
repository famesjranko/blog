<text x="320" y="679.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="muted">:9117</text>
<text x="384" y="679.0" textLength="96" lengthAdjust="spacingAndGlyphs" class="label">flaresolverr</text>
<text x="488" y="679.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="muted">:8191</text>
