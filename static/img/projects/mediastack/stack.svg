<text x="232" y="13.0" textLength="96" lengthAdjust="spacingAndGlyphs" class="heading">THE INTERNET</text>
<text x="440" y="49.0" textLength="128" lengthAdjust="spacingAndGlyphs" class="no">never forwarded:</text>
<text x="232" y="67.0" textLength="88" lengthAdjust="spacingAndGlyphs" class="heading">YOUR ROUTER</text>
<text x="440" y="67.0" textLength="128" lengthAdjust="spacingAndGlyphs" class="no">81 · 3001 · 8000</text>
<text x="200" y="85.0" textLength="152" lengthAdjust="spacingAndGlyphs" class="label">forwards four ports</text>
<text x="440" y="85.0" textLength="128" lengthAdjust="spacingAndGlyphs" class="no">51821, and every</text>
<text x="224" y="103.0" textLength="96" lengthAdjust="spacingAndGlyphs" class="label">nothing else</text>
<text x="440" y="103.0" textLength="128" lengthAdjust="spacingAndGlyphs" class="no">other admin port</text>
<text x="56" y="175.0" textLength="64" lengthAdjust="spacingAndGlyphs" class="ok">80 · 443</text>
<text x="280" y="175.0" textLength="80" lengthAdjust="spacingAndGlyphs" class="ok">6881 peers</text>
<text x="408" y="175.0" textLength="72" lengthAdjust="spacingAndGlyphs" class="ok">51820/udp</text>
<text x="80" y="193.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="label">https</text>
<text x="408" y="193.0" textLength="72" lengthAdjust="spacingAndGlyphs" class="label">wireguard</text>
<text x="24" y="211.0" textLength="88" lengthAdjust="spacingAndGlyphs" class="heading">DEBIAN HOST</text>
<text x="40" y="265.0" textLength="136" lengthAdjust="spacingAndGlyphs" class="heading">DOCKER-USER chain</text>
<text x="504" y="265.0" textLength="64" lengthAdjust="spacingAndGlyphs" class="heading">HOME LAN</text>
<text x="40" y="283.0" textLength="384" lengthAdjust="spacingAndGlyphs" class="label">forwarded ports pass through; admin ports answer</text>
<text x="488" y="283.0" textLength="96" lengthAdjust="spacingAndGlyphs" class="label">phones, TVs,</text>
<text x="40" y="301.0" textLength="392" lengthAdjust="spacingAndGlyphs" class="label">LAN, loopback and Tailscale only; others dropped.</text>
<text x="480" y="301.0" textLength="104" lengthAdjust="spacingAndGlyphs" class="label">laptops reach</text>
<text x="40" y="319.0" textLength="352" lengthAdjust="spacingAndGlyphs" class="label">fail2ban bans an address here after repeated</text>
<text x="496" y="319.0" textLength="80" lengthAdjust="spacingAndGlyphs" class="label">every port</text>
<text x="40" y="337.0" textLength="112" lengthAdjust="spacingAndGlyphs" class="label">failed logins.</text>
<text x="160" y="337.0" textLength="160" lengthAdjust="spacingAndGlyphs" class="no">No chain, no Docker.</text>
<text x="472" y="337.0" textLength="120" lengthAdjust="spacingAndGlyphs" class="label">(host bindings)</text>
<text x="24" y="373.0" textLength="104" lengthAdjust="spacingAndGlyphs" class="heading">docker bridge</text>
<text x="120" y="427.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="label">proxy</text>
<text x="224" y="427.0" textLength="88" lengthAdjust="spacingAndGlyphs" class="label">qbittorrent</text>
<text x="360" y="427.0" textLength="72" lengthAdjust="spacingAndGlyphs" class="label">wireguard</text>
<text x="480" y="427.0" textLength="104" lengthAdjust="spacingAndGlyphs" class="label">every service</text>
<text x="104" y="445.0" textLength="64" lengthAdjust="spacingAndGlyphs" class="ok">:80 :443</text>
<text x="248" y="445.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="ok">:6881</text>
<text x="352" y="445.0" textLength="80" lengthAdjust="spacingAndGlyphs" class="ok">:51820/udp</text>
<text x="480" y="445.0" textLength="96" lengthAdjust="spacingAndGlyphs" class="label">by host port</text>
<text x="152" y="481.0" textLength="72" lengthAdjust="spacingAndGlyphs" class="label">publishes</text>
<text x="408" y="481.0" textLength="152" lengthAdjust="spacingAndGlyphs" class="label">one tier per device</text>
<text x="344" y="535.0" textLength="192" lengthAdjust="spacingAndGlyphs" class="label">whole LAN · the server ·</text>
<text x="104" y="553.0" textLength="64" lengthAdjust="spacingAndGlyphs" class="label">jellyfin</text>
<text x="224" y="553.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="label">seerr</text>
<text x="328" y="553.0" textLength="216" lengthAdjust="spacingAndGlyphs" class="label">the containers · jellyfin ·</text>
<text x="120" y="571.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="muted">:8096</text>
<text x="224" y="571.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="muted">:5055</text>
<text x="376" y="571.0" textLength="128" lengthAdjust="spacingAndGlyphs" class="label">jellyfin + seerr</text>
<text x="24" y="625.0" textLength="184" lengthAdjust="spacingAndGlyphs" class="heading">never from the internet</text>
<text x="16" y="643.0" textLength="496" lengthAdjust="spacingAndGlyphs" class="label">the LAN, and VPN devices on the LAN, server or containers tier</text>
<text x="16" y="679.0" textLength="48" lengthAdjust="spacingAndGlyphs" class="label">sonarr</text>
<text x="72" y="679.0" textLength="40" lengthAdjust="spacingAndGlyphs" class="muted">:8989</text>
