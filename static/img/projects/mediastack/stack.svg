<text x="24" y="751.0" textLength="112" lengthAdjust="spacingAndGlyphs" class="heading">ONE FILESYSTEM</text>
<text x="16" y="787.0" textLength="136" lengthAdjust="spacingAndGlyphs" class="label">media/{tv,movies}</text>
<text x="200" y="787.0" textLength="224" lengthAdjust="spacingAndGlyphs" class="label">hardlinked: one file on disk</text>
<text x="464" y="787.0" textLength="160" lengthAdjust="spacingAndGlyphs" class="label">torrents/{tv,movies}</text>
<text x="16" y="805.0" textLength="136" lengthAdjust="spacingAndGlyphs" class="label">jellyfin plays it</text>
<text x="216" y="805.0" textLength="184" lengthAdjust="spacingAndGlyphs" class="label">sonarr · radarr file it</text>
<text x="456" y="805.0" textLength="168" lengthAdjust="spacingAndGlyphs" class="label">qbittorrent writes it</text>
