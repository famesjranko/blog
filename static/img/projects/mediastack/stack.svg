<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-terminal" viewBox="0 0 624 810" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">How MediaStack is wired, from the internet to the filesystem</title>
<desc id="stack-desc">The internet reaches the router, which forwards only ports 80 and 443 to the reverse proxy, 6881 to qBittorrent peers and 51820 UDP to WireGuard; every admin port stays unforwarded. On the Debian host a DOCKER-USER chain lets the forwarded ports through, lets only LAN, loopback and Tailscale addresses reach the admin ports, and drops every other source; fail2ban adds a ban to the same chain after repeated failed logins to the published pages; without the chain Docker does not start. Home LAN devices reach every port. On the Docker bridge the proxy publishes Jellyfin and Seerr, and WireGuard gives each device one tier: the whole LAN, the server, the containers, Jellyfin only, or Jellyfin and Seerr. Sonarr, Radarr, Jackett, FlareSolverr, Bazarr, the qBittorrent UI, Portainer, Homepage, Uptime Kuma, Beszel and the proxy and VPN admin pages are never reachable from the internet: only from the LAN, or from VPN devices on the LAN, server or containers tier. Downloads and media share one filesystem, so a finished download is hardlinked into the library.</desc>
